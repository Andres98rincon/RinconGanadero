<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183d32">
    <title>Sin conexión | Rincón Ganadero</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; display: grid; margin: 0; place-items: center; padding: 24px; background: #f3f5f0; color: #202c27; font-family: system-ui, sans-serif; }
        main { width: min(100%, 440px); padding: 36px; border: 1px solid #e2e8e2; border-radius: 12px; background: #fff; text-align: center; }
        img { width: 76px; height: 76px; margin-bottom: 18px; border-radius: 16px; }
        h1 { margin: 0 0 10px; color: #183d32; font-size: 24px; }
        p { margin: 0; color: #748078; font-size: 14px; line-height: 1.65; }
        a { display: inline-flex; min-height: 42px; align-items: center; margin-top: 24px; padding: 0 16px; border-radius: 5px; background: #183d32; color: #fff; font-size: 13px; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <img src="./images/rincon-ganadero.png" alt="Logo de Rincón Ganadero">
        <h1>Estás sin conexión</h1>
        <p>Por seguridad, la información de tu cuenta y de la finca no está disponible sin conexión. Comprueba tu conexión e inténtalo de nuevo.</p>
        <a href="./">Volver a intentar</a>
    </main>
</body>
</html>
