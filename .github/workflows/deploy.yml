# Cada push a main: instala, compila los assets, corre las pruebas y, si todo pasa,
# sube public/build al servidor y ejecuta deploy.sh por SSH.
# Configuración (una sola vez): GitHub → Settings → Secrets and variables → Actions:
#   SSH_HOST, SSH_PORT, SSH_USER, SSH_KEY (llave privada), DEPLOY_PATH, PUBLIC_PATH
name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip, exif, bcmath, pdo_sqlite, sqlite3
          coverage: none

      - name: Instalar dependencias de PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Compilar assets
        run: |
          npm ci
          npm run build

      - name: Correr las pruebas
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Subir public/build
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            public/build/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.PUBLIC_PATH }}/build/"

      - name: Ejecutar deploy.sh en el servidor
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && bash deploy.sh"
